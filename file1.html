<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    .calculator { display: inline-block; border: 2px solid #333; padding: 10px; border-radius: 10px; }
    input { width: 210px; height: 40px; font-size: 20px; text-align: right; margin-bottom: 10px; }
    button { width: 50px; height: 50px; font-size: 18px; margin: 3px; }
  </style>
</head>
<body>
  <h2>Simple Calculator</h2>
  <div class="calculator">
    <input type="text" id="display" disabled><br>

    <button onclick="clearDisplay()">C</button>
    <button onclick="deleteChar()">⌫</button>
    <button onclick="appendChar('/')">/</button>
    <button onclick="appendChar('*')">*</button><br>

    <button onclick="appendChar('7')">7</button>
    <button onclick="appendChar('8')">8</button>
    <button onclick="appendChar('9')">9</button>
    <button onclick="appendChar('-')">-</button><br>

    <button onclick="appendChar('4')">4</button>
    <button onclick="appendChar('5')">5</button>
    <button onclick="appendChar('6')">6</button>
    <button onclick="appendChar('+')">+</button><br>

    <button onclick="appendChar('1')">1</button>
    <button onclick="appendChar('2')">2</button>
    <button onclick="appendChar('3')">3</button>
    <button onclick="calculate()">=</button><br>

    <button onclick="appendChar('0')" style="width:106px">0</button>
    <button onclick="appendChar('.')">.</button>
  </div>

  <script>
    function appendChar(char) {
      document.getElementById("display").value += char;
    }
    function clearDisplay() {
      document.getElementById("display").value = "";
    }
    function deleteChar() {
      let current = document.getElementById("display").value;
      document.getElementById("display").value = current.slice(0, -1);
    }
    function calculate() {
      try {
        document.getElementById("display").value = eval(document.getElementById("display").value);
      } catch (e) {
        alert("Invalid Expression");
      }
    }
  </script>
</body>
</html>
