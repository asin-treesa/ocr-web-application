{% extends "layout.html" %} {% block content %}
<div class="container">
  <h2>Forgot Password</h2>
  <form method="POST">
    <input
      type="text"
      name="username"
      placeholder="Enter your email"
      required
    />
    <button type="submit">Send Reset Link</button>
  </form>
  <a href="{{ url_for('login') }}">Back to Login</a>
</div>
{% endblock %}
