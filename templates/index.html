{% extends "layout.html" %}
{% block content %}
<div class="container">
  <h2>Welcome, {{ username }}</h2>

  <form method="POST" enctype="multipart/form-data">
    <input type="file" name="file"
       accept=".pdf,.png,.jpg,.jpeg,.tiff,.bmp"
       required />
    <button type="submit">Extract OCR</button>
  </form>

  {% if ocr_text %}
  <h3>Latest Extracted Text:</h3>
  <textarea
    id="ocrText"
    readonly
    style="width: 100%; height: 300px; padding: 10px; white-space: pre-wrap"
  >{{ ocr_text }}</textarea>
  <br />
  <button onclick="copyText()">Copy Text</button>
  <button onclick="downloadText()">Download Text</button>
  <hr />
  {% endif %}

  {% if previous_files %}
  <h3>Previous Extractions:</h3>
  {% for file in previous_files %}
    <div style="margin-bottom: 30px;">
      <strong>{{ file.filename }}</strong><br />
      <textarea readonly style="width: 100%; height: 200px; white-space: pre-wrap;">{{ file.content }}</textarea>
      <br />
      <button onclick="copySpecific(this)">Copy</button>
      <button 
  data-filename="{{ file.filename }}" 
  data-content="{{ file.content | e }}"
  onclick="downloadSpecific(this)">
  Download
</button>

     
    </div>
  {% endfor %}
  {% endif %}

  <br />
  <a href="{{ url_for('logout') }}">Logout</a>
</div>

<script>
  function copyText() {
    const textArea = document.getElementById("ocrText");
    textArea.select();
    textArea.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Text copied to clipboard!");
  }

  function downloadText() {
    const text = document.getElementById("ocrText").value;
    const pdfName = document.querySelector('input[type="file"]').files[0]?.name || "output";
    const fileName = pdfName.split('.')[0] + "_extract.txt";

    const blob = new Blob([text], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = window.URL.createObjectURL(blob);
    link.download = fileName;
    link.click();
  }

  function copySpecific(btn) {
    const textarea = btn.parentElement.querySelector("textarea");
    textarea.select();
    textarea.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Text copied to clipboard!");
  }

  function downloadSpecific(button) {
  const filename = button.getAttribute("data-filename");
  const content = button.getAttribute("data-content");

  const blob = new Blob([content], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = window.URL.createObjectURL(blob);
  link.download = filename + "_extract.txt";
  link.click();
}
</script>
{% endblock %}
